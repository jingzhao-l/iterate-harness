name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # WHY THE SUITE IS SPLIT AT ALL. Six runs of the single-job shape ended the same way, and the
  # seventh (40190097615) is the one that finally measured why no instrument could help:
  #   • `Python quality` — a job that ENDED — fetched 31,956 bytes of log from
  #     `actions/jobs/121159060680/logs`. The test leg, in progress at the same moment, answered
  #     **HTTP 404** at `actions/jobs/{id}/logs`. So a job's log exists only once the job has ended.
  #   • Therefore `runs/{id}/logs` holding "only the three successful jobs" was never about buffering:
  #     a step that never ends leaves no log, no annotation body, and no artifact — `if: always()` is
  #     itself a step, and it is gated behind the step that never finishes. Measured: that run's
  #     `actions/runs/40190097615/artifacts` count is **0**.
  #   • The 5-second ceiling control proved the hard stop works on this runner (rc=124, 11:44:23 →
  #     11:44:28), and `Run test suite` was still reported `in_progress` from ~11:44:41 until the cut
  #     at ~12:29 — **25 minutes past its own 1,200 s ceiling plus `--kill-after=60`**. So the
  #     instrument was fine and the thing it was watching refused to be observed.
  # Nothing observable from outside a wedged runner can separate "a process survived SIGKILL" (this
  # suite does spawn children with `start_new_session=True`: `tasks/manager.py`, `tools/bash_tool.py`,
  # `hooks/executor.py`, `services/cron_scheduler.py`, `tools/remote_trigger_tool.py`) from "the
  # runner stopped reporting and the API is showing a stale state". Both erase the evidence. So the
  # shape changed: keep the *observations* inside units small enough to end, because ending is the
  # precondition for a log existing at all.
  #
  # What each bucket buys: its own machine (so the 2-core contention that made this suite measure
  # 36m27s locally cannot stack across buckets), a wall clock far under the ~45-minute cut, and — if
  # one still wedges — a named file list instead of "one of 3,099". `scripts/split_suite.py` builds
  # the plan and refuses to emit one that is not an exact partition, so the split cannot quietly turn
  # CI green over a subset; `tests/test_ci_workflow_shape.py` pins this job's wiring.
  suite-plan:
    name: Plan the suite split
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      buckets: ${{ steps.split.outputs.buckets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Build web frontend (editable install requires frontend/web/dist)
        working-directory: frontend/web
        run: |
          set -euo pipefail
          npm ci
          npm run build

      # One build, twelve restores: `uv sync` needs `frontend/web/dist`, and building it in every
      # bucket job would put twelve `npm ci` runs between this suite and a green answer. Tarred so the
      # directory layout is a fact about the archive rather than a property of an action's version.
      - name: Ship the frontend build to the bucket jobs
        run: |
          set -euo pipefail
          tar -czf web-dist.tar.gz -C frontend/web dist

      - name: Publish the frontend build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-tarball
          path: web-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Collect the suite (a hang here is an import-time block, not a test)
        # Split out on purpose, and measured: this step answers in 13 s on the runner and 31 s here,
        # which is what ruled collection/import blocking out of the 45-minute death in its track.
        run: |
          set -euo pipefail
          rc=0
          timeout --kill-after=60 600 uv run pytest --collect-only -q > collect.txt 2>&1 || rc=$?
          cat collect.txt
          echo "collect_exit=$rc"
          test "$rc" = 0

      - name: Split it into buckets that can each end
        id: split
        env:
          SUITE_BUCKETS: "6"
        run: |
          set -euo pipefail
          uv run python scripts/split_suite.py --buckets "$SUITE_BUCKETS" \
            --github-output "$GITHUB_OUTPUT" --collect-file collect.txt

      - name: Check the vendored kernel corpus against the published package
        # tests/kernel_fixtures/ is a sha256-pinned copy of the contract published
        # inside iterate-kernel. Here the kernel is not in reach, so the pin is
        # checked against the registry artifact — a stale pin goes red rather than
        # letting this repo assert bytes the shared kernel no longer uses. It
        # requires the pinned version to be published; the monorepo CI checks the
        # same manifest against kernel/fixtures (the source of truth) first.
        run: uv run python scripts/check_kernel_fixtures.py

  python-tests:
    name: Python tests (${{ matrix.python-version }} / bucket ${{ matrix.bucket.id }})
    needs: suite-plan
    runs-on: ubuntu-latest
    # 30, not 90: the point of the split is that a bucket ENDS, because a job that ends is the
    # precondition for its log existing at all (see the note above). A bucket is ~517 of 3,099 tests,
    # and the whole suite is 115 s idle here, so 30 minutes is not a guess at the cost — it is room
    # for the worst shared runner. remedy if a bucket ever hits it: the log names the files, act on
    # those; do not raise the number and do not mark anything skip.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
        bucket: ${{ fromJson(needs.suite-plan.outputs.buckets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore the frontend build from the plan job
        uses: actions/download-artifact@v4
        with:
          name: web-dist-tarball

      - name: Unpack it and prove the editable install's prerequisite is really there
        # Checked rather than assumed: `uv sync` fails on a missing `frontend/web/dist` with a build
        # backend message that names neither the artifact nor this step, so a restore that silently
        # downloaded nothing would surface as a confusing failure twelve times.
        run: |
          set -euo pipefail
          test -f web-dist.tar.gz
          tar -xzf web-dist.tar.gz -C frontend/web
          test -d frontend/web/dist
          echo "restored $(find frontend/web/dist -type f | wc -l | tr -d ' ') file(s) into frontend/web/dist"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Prove the ceiling is enforced before trusting it as an instrument
        # A five-second control, kept because it is what made the last question answerable: it proved
        # `timeout --kill-after` does fire inside this job (rc=124 in 5 s, run 40190097615), which is
        # what left "something survived the signal, or the runner stopped reporting" as the only pair
        # of readings standing. It cannot be checked here: this machine has no `timeout` and no
        # `gtimeout` (measured: both absent), so CI is where this is observed — which is also why it
        # echoes its own exit code and elapsed seconds. If it ever goes red, every inference of the
        # form "the ceiling fired / did not fire" is void.
        run: |
          set -euo pipefail
          start=$(date +%s)
          rc=0
          timeout 5 sleep 30 || rc=$?
          end=$(date +%s)
          echo "ceiling_control_exit=$rc elapsed=$((end-start))s (want 124 and <=10s)"
          test "$rc" = 124
          test "$((end-start))" -le 10

      - name: Collect this bucket and check it is the bucket the plan promised
        env:
          BUCKET_PATHS: ${{ matrix.bucket.paths }}
          BUCKET_COUNT: ${{ matrix.bucket.count }}
        # $BUCKET_PATHS is unquoted on purpose: it is a space-separated list of paths produced by
        # scripts/split_suite.py from this repo's own collection, not input from outside the job.
        #
        # This step is the anti-corruption layer for the split. A bucket whose path list resolved to
        # fewer tests than planned would be a green job over a subset, and nothing else in CI could
        # see the difference — so the count is re-measured here and checked against the plan by the
        # same script that has to agree with pytest's own total.
        run: |
          set -euo pipefail
          rc=0
          timeout --kill-after=60 300 uv run pytest --collect-only -q $BUCKET_PATHS \
            > bucket-collect.txt 2>&1 || rc=$?
          cat bucket-collect.txt
          echo "collect_exit=$rc"
          test "$rc" = 0
          uv run python scripts/split_suite.py --buckets 1 \
            --expect-total "$BUCKET_COUNT" --collect-file bucket-collect.txt

      - name: Run test suite
        # `-v` and the two `faulthandler` options stay because they produced rulings, not decoration:
        # with `-v` on the channel the 45-minute cut could not be a silence timeout, and `faulthandler`
        # is the only thing that names a test stuck mid-call — measured against a deliberate
        # `sleep(60)` probe, where it printed the file, line and test name and exited 1.
        # Output goes through `tee`, so it is both a file the artifact step can ship and a live
        # channel. (An earlier revision redirected to a file and `cat`-ed it afterwards on the theory
        # that a detached child holding the Actions pipe was what kept the step alive; run 40187109237
        # measured that theory false — the step still outran its ceiling with the pipe unheld.)
        env:
          PYTEST_HARD_STOP: "1200"
          PYTHONUNBUFFERED: "1"
          BUCKET_PATHS: ${{ matrix.bucket.paths }}
        run: |
          set -euo pipefail
          rc=0
          timeout --kill-after=60 "$PYTEST_HARD_STOP" \
            uv run pytest -v -o faulthandler_timeout=300 -o faulthandler_exit_on_timeout=true \
            $BUCKET_PATHS \
            2>&1 | tee pytest-ci.log || rc=$?
          echo "pytest_exit=$rc (124 = the ceiling fired; 0 = the bucket really finished)"
          exit "$rc"

      - name: Upload the suite log (the only thing that survives a dead runner)
        # `if: always()` because the value of this step is exactly the failure paths: a ceiling, a
        # cancellation, a wedged bucket. Honest about its limit, which run 40190097615 measured — if
        # the bucket job itself wedges, this step never runs and the artifact count stays 0; it ships
        # the log for every case where pytest stopped but the runner did not.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ci-log-${{ matrix.python-version }}-${{ matrix.bucket.id }}
          path: pytest-ci.log
          if-no-files-found: warn
          retention-days: 30

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Build web frontend (editable install requires frontend/web/dist)
        working-directory: frontend/web
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Mypy (strict)
        run: uv run mypy src

  npm-wrapper:
    name: npm wrapper tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm wrapper test suite
        working-directory: npm
        run: npm test

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/terminal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/terminal/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
