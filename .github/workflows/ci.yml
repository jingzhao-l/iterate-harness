name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A ceiling exists so the run ENDS with an uploaded log instead of a runner that "lost
    # communication" and takes its log with it (four times in a row). 90 is not a guess at the suite's
    # cost: `pytest -q tests` was measured at 36m27s for 3083 tests on 2026-10-25, which leaves room
    # for a slower shared runner. remedy if this ever hits 90: the log now says where it stopped —
    # act on that, do not raise the number.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Build web frontend (editable install requires frontend/web/dist)
        working-directory: frontend/web
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Collect the suite (a hang here is an import-time block, not a test)
        # Split out on purpose: `faulthandler_timeout` only dumps while a **test** is running, so a
        # wait during collection or in a session fixture would produce the same silence it produced
        # before. This step either finishes — which localises the problem to the run — or it is the
        # step that dies, which names the module that blocks at import.
        run: uv run pytest --collect-only -q

      - name: Run test suite
        # Four runs in a row died the same way on this step: the step started, no further output
        # reached the log, and the job was killed 45 minutes after it began with the annotation "The
        # hosted runner lost communication with the server" — and because the runner died, NO LOG WAS
        # UPLOADED (`--log-failed` says `log not found`; `runs/{id}/logs` contains only the three
        # successful jobs). Measured: 40167475388, 40168346235, 40103418285 (v2.10.0), and 40171467085
        # — the last of those already carried `faulthandler_timeout=300 + faulthandler_exit_on_timeout`
        # and died at 07:05→07:50 exactly like the other three, still with no log.
        # Two causes fit, and the first iteration could not tell them apart:
        #   (a) a real wait — something in the suite blocks forever on ubuntu (it cannot be reproduced
        #       here: the same suite finishes on macOS, no docker/podman/colima on this machine);
        #   (b) the suite is simply slower than the runner's silence window — **measured locally
        #       2026-10-25: `pytest -q tests` took 2187.62s (36m27s) for 3083 tests**, so a runner
        #       that gets no output for 45 minutes is not proof of a hang at all.
        # `-v` is the change that serves both: one line per test keeps the log channel open (so a slow
        # suite finishes and reports, and a hung one leaves the last name printed as the place it
        # stopped), and faulthandler adds a full-thread stack if a *single* test passes 300s.
        # remedy if this goes red: the dump or the last `-v` line names where it waits — fix that
        # wait, or split the suite if the answer is "this phase is legitimately long". Do NOT raise
        # faulthandler_timeout to make red disappear, do NOT mark anything skip, and do NOT take `-v`
        # out to shorten the log: the per-test line is the only reason this step is findable.
        run: uv run pytest -v -o faulthandler_timeout=300 -o faulthandler_exit_on_timeout=true

      - name: Check the vendored kernel corpus against the published package
        # tests/kernel_fixtures/ is a sha256-pinned copy of the contract published
        # inside iterate-kernel. Here the kernel is not in reach, so the pin is
        # checked against the registry artifact — a stale pin goes red rather than
        # letting this repo assert bytes the shared kernel no longer uses. It
        # requires the pinned version to be published; the monorepo CI checks the
        # same manifest against kernel/fixtures (the source of truth) first.
        run: uv run python scripts/check_kernel_fixtures.py

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Build web frontend (editable install requires frontend/web/dist)
        working-directory: frontend/web
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Mypy (strict)
        run: uv run mypy src

  npm-wrapper:
    name: npm wrapper tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm wrapper test suite
        working-directory: npm
        run: npm test

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/terminal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/terminal/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
