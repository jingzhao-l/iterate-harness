name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A ceiling exists so the run ENDS with an uploaded log instead of a runner that "lost
    # communication" and takes its log with it (four times in a row). 90 is not a guess at the suite's
    # cost: `pytest -q tests` was measured at 36m27s for 3083 tests on 2026-10-25, which leaves room
    # for a slower shared runner. remedy if this ever hits 90: the log now says where it stopped —
    # act on that, do not raise the number.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Build web frontend (editable install requires frontend/web/dist)
        working-directory: frontend/web
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Prove the ceiling is enforced before trusting it as an instrument
        # A five-second control, and the only one that answers the question the last two iterations
        # left open. `timeout 5 sleep 30` either returns in ~5 s with 124 — in which case the ceiling
        # in the next step is real, and a step that outruns it means something genuinely survived the
        # signal — or it does not, in which case every conclusion drawn from "the hard stop fired / did
        # not fire" is void and the investigation is about the runner, not about this suite. It cannot
        # be checked here: this machine has no `timeout` and no `gtimeout` (measured: both absent, the
        # same gap that made `timeout` unusable in earlier local scripts), so CI is where this one is
        # observed — which is also why it echoes its own exit code and elapsed seconds.
        run: |
          set -euo pipefail
          start=$(date +%s)
          rc=0
          timeout 5 sleep 30 || rc=$?
          end=$(date +%s)
          echo "ceiling_control_exit=$rc elapsed=$((end-start))s (want 124 and <=10s)"
          test "$rc" = 124
          test "$((end-start))" -le 10

      - name: Collect the suite (a hang here is an import-time block, not a test)
        # Split out on purpose: `faulthandler_timeout` only dumps while a **test** is running, so a
        # wait during collection or in a session fixture would produce the same silence it produced
        # before. This step either finishes — which localises the problem to the run — or it is the
        # step that dies, which names the module that blocks at import.
        run: uv run pytest --collect-only -q

      - name: Run test suite
        # Five runs in a row died the same way on this step: the step started, no further output
        # reached the log, and the job was killed **exactly 45 minutes** after it began with the
        # annotation "The hosted runner lost communication with the server" — and because the runner
        # died, NO LOG WAS UPLOADED (`--log-failed` says `log not found`; `runs/{id}/logs` contains
        # only the successful jobs). Measured end-to-end, both matrix legs each time, to the second:
        # 40103418285 (v2.10.0) 14:38→15:23/15:24, 40167475388 05:59→06:44, 40168346235 06:13→06:58,
        # 40171467085 07:05→07:50, 40179763746 09:13:44→**09:58:45**.
        # Two iterations of instrumentation, each of which falsified the theory before it:
        #   - `faulthandler_timeout=300 + faulthandler_exit_on_timeout` (40171467085): died anyway at
        #     45:00, still no log. That plugin only dumps while a **test call** is running.
        #   - `-v` (a line per test, so the channel cannot sit silent) + a separate `--collect-only`
        #     step (40179763746): `Collect the suite` finished in **13 seconds** — so import-time and
        #     collection blocking is ruled out — and the job died at 45:00 anyway.
        # And two local measurements kill the two easy explanations:
        #   - **the suite is not slow**: idle, `pytest -q tests` = **115.59s** for 3089 collected
        #     (6 failed / 3077 passed / 6 skipped, the known本机-environment six); under heavy
        #     contention the same tree measured 4m20s and once 36m27s.
        #   - **it is not memory**: `/usr/bin/time -l` on that run reports
        #     **286,605,312 bytes maximum resident set** — 273 MB against a 7 GB runner, so the
        #     OOM-killed-runner story is out.
        # What that leaves is a wall, not a wait. Every theory that predicted it from our own
        # configuration is now measured false:
        #   - `timeout-minutes: 90` was set on this job and the run still ended at **45:01**
        #     (40179763746, 09:13:44 → 09:58:45) — so the cut is not this workflow's setting, and
        #     both matrix legs ended at the *same second*, which a per-test wait would not do.
        #   - log volume does not drive it either: the `-v` run died exactly like the `-q` runs.
        #   - it is not slowness (115s idle locally) and not memory (273 MB peak locally).
        # So the working hypothesis is an account/plan-side ceiling around 45 minutes, plus a suite
        # that on a 2-core runner takes longer than that (locally the same tree measured 4m20s and
        # 36m27s under load, so >45 min on shared hardware is credible).
        # The probe ran, and it refused to resolve the question. On run 40184095706 the step was
        # **still reported `in_progress` 27 minutes in** — 7 minutes past its own 1200 s ceiling with
        # `--kill-after=60` long expired — and a cancelled run of the same job still shipped a log
        # archive containing **only the three successful jobs** (`runs/40184095706/logs` lists npm
        # wrapper / Python quality / Frontend typecheck). Then the next instrument — moving pytest's
        # output to a file so no orphan can hold the Actions pipe (run 40187109237) — was cancelled at
        # 27 minutes with the step **still `in_progress`** past the same ceiling.
        # Read carefully, because it is tempting to over-conclude: a step that is still `in_progress`
        # past a ceiling it should have honoured is consistent with **two** states we cannot separate
        # from here — (i) something the step waits on survived the signal (this suite does spawn
        # children with `start_new_session=True`: `tasks/manager.py`, `tools/bash_tool.py`,
        # `hooks/executor.py`, `services/cron_scheduler.py`, `tools/remote_trigger_tool.py`), or
        # (ii) the runner stopped reporting and the API is showing a stale state until the 45-minute
        # no-communication cut. Nothing observable from outside distinguishes them, and both erase the
        # log. So the flag-level theories are exhausted: what is missing is an observation that
        # **leaves the machine**.
        # So the instrument below is chosen for one property: **its output leaves the machine.**
        # `pytest-ci.log` is uploaded as an artifact from an `if: always()` step, so the partial log
        # survives whichever way this job ends — cancellation, a ceiling, or a dead runner — and the
        # first line of that artifact ("test session starts" … or a per-test list that stops
        # mid-way) is the observation nobody has had yet.
        # remedy with that artifact in hand: act on what it names. Do NOT raise the ceiling to make
        # the red disappear, do NOT mark anything skip, and do NOT take `-v` or the collect step out:
        # they produced every ruling recorded above (collection answers in 13 s; the suite is 115 s
        # and 273 MB here, so neither import blocking, slowness nor memory explains a 45-minute death
        # at the same second on both legs).
        env:
          PYTEST_HARD_STOP: "1200"
        run: |
          set -euo pipefail
          rc=0
          timeout --kill-after=60 "$PYTEST_HARD_STOP" \
            uv run pytest -v -o faulthandler_timeout=300 -o faulthandler_exit_on_timeout=true \
            > pytest-ci.log 2>&1 || rc=$?
          cat pytest-ci.log
          echo "pytest_exit=$rc (124 = the ceiling fired; 0 = the suite really finished)"
          exit "$rc"

      - name: Upload the suite log (the only thing that survives a dead runner)
        # `if: always()` because the value of this step is exactly the cases where the job is
        # already lost: a ceiling, a cancellation, or a runner that stops reporting.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ci-log-${{ matrix.python-version }}
          path: pytest-ci.log
          if-no-files-found: warn
          retention-days: 30

      - name: Check the vendored kernel corpus against the published package
        # tests/kernel_fixtures/ is a sha256-pinned copy of the contract published
        # inside iterate-kernel. Here the kernel is not in reach, so the pin is
        # checked against the registry artifact — a stale pin goes red rather than
        # letting this repo assert bytes the shared kernel no longer uses. It
        # requires the pinned version to be published; the monorepo CI checks the
        # same manifest against kernel/fixtures (the source of truth) first.
        run: uv run python scripts/check_kernel_fixtures.py

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Build web frontend (editable install requires frontend/web/dist)
        working-directory: frontend/web
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Mypy (strict)
        run: uv run mypy src

  npm-wrapper:
    name: npm wrapper tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm wrapper test suite
        working-directory: npm
        run: npm test

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/terminal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/terminal/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
