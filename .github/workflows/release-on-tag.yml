name: Release create on tag

# Why this exists
# ---------------
# `release.yml` builds and publishes the wheel, but only after something
# creates the GitHub Release for the tag. Its own header records how fragile
# that has been: the `release` event "has not fired reliably since v1.12.10",
# so releases came to depend on a machine holding a *write* token
# (`gh release create`, or `gh workflow run` for the dispatch fallback). When
# that token is unavailable — expired PAT, keychain credential an automation
# context cannot read (`security find-generic-password -w` → rc=36), headless
# box — the release stalls at "tag pushed, nothing built".
#
# v2.5.0 hit exactly that, and then hit a second wall: creating the Release
# did *not* emit a `release: published` run, and dispatching release.yml
# through the REST API returned 403 (a GITHUB_TOKEN may not start other
# workflows).
#
# So a pushed `v*` tag now does the whole job, using nothing beyond the
# `git push` that created it:
#   1. create the Release for the tag (idempotent — an existing one is kept),
#   2. call `release.yml` as a **reusable workflow**. A `uses:` call is an
#      ordinary job, not an event, so it is not blocked by the
#      GITHUB_TOKEN-cannot-trigger-workflows rule that killed the API dispatch.
#      release.yml still resolves its tree from `github.ref_name`, which in a
#      called workflow is the tag that triggered this run, so the wheel is
#      built from exactly the tagged source, and `secrets: inherit` forwards
#      GPG_PRIVATE_KEY / GPG_PASSPHRASE / PYPI_PASSWORD.
#
# Net effect: pushing the tag is now a complete, idempotent "publish this
# release", and re-pushing it safely re-runs the build. The artifact path is
# unchanged — release.yml still does the building, signing, uploading and
# PyPI publish.
#
# Release notes come from the *annotated tag message* — the text the
# maintainer already writes when tagging — so publishing never needs a second
# copy of the notes. `--generate-notes` is the fallback for a lightweight tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# One publish per tag; a re-pushed tag must not race itself.
concurrency:
  group: release-create-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release for the tag
    runs-on: ubuntu-latest
    steps:
      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release for $TAG already exists — keeping it"
            exit 0
          fi

          # Annotated tag -> tag object -> its message becomes the notes.
          notes=""
          if sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type')" = "tag" ]; then
              notes="$(gh api "repos/$REPO/git/tags/$sha" --jq '.message' 2>/dev/null || true)"
            fi
          fi

          if [ -n "$notes" ]; then
            gh release create "$TAG" --repo "$REPO" --title "iterate-harness $TAG" --notes "$notes"
          else
            # Lightweight tag: fall back to GitHub's own release notes.
            gh release create "$TAG" --repo "$REPO" --title "iterate-harness $TAG" --generate-notes
          fi

  build-wheel:
    name: Build, sign, upload and publish the wheel
    needs: create-release
    uses: ./.github/workflows/release.yml
    secrets: inherit
