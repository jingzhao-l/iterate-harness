name: Release create on tag

# Why this exists
# ---------------
# `release.yml` only builds and publishes the wheel on `release: published`,
# and that step needs a human (or a local `gh` session) to create the GitHub
# Release first. The header of `release.yml` records the history: the `release`
# event "has not fired reliably since v1.12.10", so every release since then
# has needed a manual `gh workflow run` — i.e. a machine holding a *write*
# token. When that token is unavailable (expired PAT, keychain credential an
# automation context cannot read, headless box), the release is stuck: the tag
# is pushed, and nothing builds.
#
# This workflow closes that hole using only what `git push` already proves we
# have: pushing a `v*` tag (1) creates the Release for it with `GITHUB_TOKEN`
# (`contents: write`) and (2) dispatches `release.yml` on the same tag
# (`actions: write`). release.yml then builds/signs/uploads the wheel and
# publishes to PyPI exactly as before — nothing about the artifact path changes.
#
# Why the dispatch is needed on top of the creation: on 2026-09-30, creating
# v2.5.0's Release did *not* produce a `release: published` run, so the build
# never started. The manual `gh workflow run` fallback needs a write token, so
# the tag push performs the dispatch instead. Doing both from one trigger also
# makes a re-pushed tag a complete, idempotent "republish" of the release.
#
# Release notes come from the *annotated tag message* — the same text the
# maintainer already writes when tagging — so publishing never needs a second
# copy of the notes to keep in sync. `--generate-notes` is the fallback when the
# tag is lightweight.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed to dispatch release.yml (see the second job).
  actions: write

# One release per tag; a retag of an existing tag must not race itself.
concurrency:
  group: release-create-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release for the tag
    runs-on: ubuntu-latest
    steps:
      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release for $TAG already exists — nothing to do"
            exit 0
          fi

          # Annotated tag -> tag object -> its message becomes the notes.
          notes=""
          if sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type')" = "tag" ]; then
              notes="$(gh api "repos/$REPO/git/tags/$sha" --jq '.message' 2>/dev/null || true)"
            fi
          fi

          if [ -n "$notes" ]; then
            gh release create "$TAG" --repo "$REPO" --title "iterate-harness $TAG" --notes "$notes"
          else
            # Lightweight tag: fall back to GitHub's own release notes.
            gh release create "$TAG" --repo "$REPO" --title "iterate-harness $TAG" --generate-notes
          fi

  dispatch-wheel-build:
    name: Dispatch the wheel build
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Kick off release.yml on the same tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `release: published` is release.yml's primary trigger, but it has
          # been unreliable for years (its own header says so) and it did not
          # fire when v2.5.0's Release was created. release.yml also accepts
          # workflow_dispatch, the documented manual fallback — do that from
          # here, where GITHUB_TOKEN is available. (workflow_dispatch is one of
          # the two events GITHUB_TOKEN may start, so the recursion guard does
          # not apply.)
          gh api -X POST "repos/$REPO/actions/workflows/release.yml/dispatches" -f ref="$TAG"
          echo "dispatched release.yml for $TAG"
