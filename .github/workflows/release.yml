name: Release publish

# Builds the pre-built wheel and ships it to BOTH channels the npm wrapper
# can install from:
#   1. PyPI (primary) — pip resolves `iterate-harness==X.Y.Z` against the
#      user's configured mirror (e.g. pypi.tuna.tsinghua.edu.cn), so installs
#      stay fast and stable even when GitHub is unreachable or its TLS cert
#      fails to verify. Published via twine (gated on the PYPI_PASSWORD secret).
#   2. GitHub release asset (fallback) — the npm wrapper can download
#      `iterate_harness-<tag>-py3-none-any.whl` and pip-install it directly.
#
# The wheel carries the compiled frontend assets (force-included by
# pyproject.toml: terminal source + frontend/web/dist), which the GitHub
# source archive does not contain.
#
# Ordering note: the wheel is built and uploaded by THIS job asynchronously
# after the release is published. Do NOT run `npm publish` until this job has
# finished — otherwise the npm wrapper cannot download the wheel and would fall
# back to the source archive (which lacks the built frontend and fails).

on:
  release:
    types: [published]
  # Manual fallback: the `release` event has not fired reliably since v1.12.10,
  # so operators can dispatch this workflow on an existing tag instead:
  #   gh workflow run release.yml --ref v1.12.11
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheel-upload:
    name: Build wheel and upload to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged tree
        uses: actions/checkout@v4
        with:
          # On `release` events use the release tag; on manual dispatch use the
          # dispatched ref (github.ref_name), e.g. `--ref v1.12.11`.
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install terminal frontend dependencies
        # Only package.json/tsconfig/src are force-included into the wheel;
        # npm deps are needed so the bundled TypeScript source stays intact,
        # which mirrors how CI typechecks it.
        working-directory: frontend/terminal
        run: npm ci

      - name: Install and build web frontend (produces dist baked into wheel)
        working-directory: frontend/web
        run: |
          npm ci
          npm run build

      - name: Verify web dist produced
        run: test -n "$(ls -A frontend/web/dist)" && echo "frontend/web/dist present"

      - name: Build wheel
        run: uv build --wheel

      - name: Inspect built wheel
        run: |
          ls -la dist
          echo "---"
          python -m zipfile -l dist/*.whl | { grep -E "_frontend_web/|_frontend/" | head -20 || true; }

      - name: Upload wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

      - name: Publish wheel to PyPI (iff token configured)
        # Primary install channel for the npm wrapper is the official PyPI
        # index (pip resolves `iterate-harness==X.Y.Z` against the user's
        # mirror, e.g. tuna). Publishing here on every release keeps PyPI in
        # sync. Best-effort: if the secret isn't configured, skip silently —
        # the GitHub wheel asset remains a working fallback.
        # NOTE: the `secrets` context is NOT available in `if:` conditionals,
        # so gate on the env var inside the run script instead. When the
        # secret is unset, TWINE_PASSWORD is empty and the step exits 0.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_PASSWORD secret not configured; skipping PyPI publish"
            exit 0
          fi
          python -m pip install --upgrade twine
          twine upload --non-interactive --skip-existing dist/*.whl