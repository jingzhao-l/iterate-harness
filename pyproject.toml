[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iterate-harness"
dynamic = ["version"]
description = "iterate - dedicated agent harness for the multi-round review/fix loop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "jingzhao-l" },
]

# Dependencies pinned to exact versions (resolved from uv.lock) to guarantee
# reproducible installs. channels-only deps (slack-sdk / python-telegram-bot /
# discord.py / lark-oapi) removed with channels/ trim.
dependencies = [
    "anthropic==0.122.0",
    "openai==3.1.0",
    "rich==15.0.0",
    "prompt-toolkit==3.0.53",
    "textual==8.2.8",
    "typer==0.27.1",
    "typing-extensions==4.16.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    # httpx reads ALL_PROXY/HTTPS_PROXY from the environment by default. A
    # socks5:// proxy without this extra makes client construction raise
    # ImportError before the harness can start at all; the OpenAI/Anthropic
    # SDKs give no actionable hint. Small, pure-Python, no transitive deps.
    "socksio==1.0.0",
    # Floor set by the 2026-09 HTTPX2 advisories: 2.12.0 fixes CVE-2026-84382
    # (unbounded streaming decompression), 2.11.0 fixes CVE-2026-84380
    # (Content-Length/Transfer-Encoding auto-framing) and CVE-2026-84379
    # (multipart header injection). Dependabot alerts #41-#43.
    "httpx2==2.12.0",
    "websockets==16.1.1; python_version < '3.11'",
    "websockets==17.0.1; python_version >= '3.11'",
    # Land the standalone repo's Dependabot bump here instead of reverting it on
    # release: uv.lock is gitignored in this subtree, so the artifact carried 2.2.0
    # while the source lagged at 2.0.0. `mcp.server.mcpserver` is a package in 2.2.0
    # but still re-exports `MCPServer`; client `stdio`/`streamable_http` unchanged.
    "mcp==2.2.0",
    "pyperclip==1.11.0",
    "pyyaml==6.0.3",
    "questionary==2.1.1",
    "watchfiles==1.2.0",
    "croniter==6.2.4",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
]

[project.optional-dependencies]
dev = [
    "pexpect==4.9.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    # Per-test bound, not per-step. Measured on runs 40199977015 / 40200818814 / 40203984602: a step
    # whose pytest session never returns cannot be ended from inside — a 1,200 s `timeout`, a detached
    # session with a bounded poll, and `gh run cancel` all left the step `in_progress`, and only
    # GitHub's own job timeout ended the *job* (uploading nothing). The bound therefore has to live
    # where pytest can still act on it: a test that outlives it is reported by name and the session
    # returns, so the step ends and the log survives.
    "pytest-timeout==2.4.0",
    "ruff==0.16.3",
    "mypy==2.3.1",
]

[project.scripts]
ih = "iterate_harness.cli:app"
iterate-harness = "iterate_harness.cli:app"

[tool.hatch.version]
# Single source of truth: read the version from the package __init__.__version__.
path = "src/iterate_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/iterate_harness"]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.iterate-harness-venv",
    "/.iterate-harness",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"frontend/terminal/package.json" = "iterate_harness/_frontend/package.json"
"frontend/terminal/tsconfig.json" = "iterate_harness/_frontend/tsconfig.json"
"frontend/terminal/src" = "iterate_harness/_frontend/src"
"frontend/web/dist" = "iterate_harness/_frontend_web"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 240 s per test. Basis, measured the same day with `--durations=12`: the slowest single test here is
# 10.90 s (`tests/test_ci_suite_step_program.py::test_the_control_step_…`), the whole 3,119-test suite
# is 124.93 s, so 240 s is ~22x the slowest observed test and no legitimate case is near it. It is a
# hang detector, not a performance budget — do not lower it to make a red go away, and do not mark the
# timed-out test skip: the fix is the wait it names. Control that it works: a deliberate `sleep(300)`
# test under `-o timeout=5` fails by name (`Failed: Timeout (>5.0s) from pytest-timeout`) and the
# session returns in 5.04 s with its neighbour still passing.
timeout = 240
timeout_method = "signal"
# The editable install (`pip install -e`) pins `iterate_harness` to ONE
# checkout, so a worktree that does not own that path would silently import —
# and test — the other tree's sources. Putting this tree's `src` first makes
# the checkout you run in the code you get, in CI and in worktrees alike.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly: ruff 0.16 expanded its default rules, which
# would suddenly fail CI on version bumps. This is the set the codebase
# was written and reviewed against.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
# src-layout: resolve `iterate_harness` from `src/` to prevent mypy from
# picking a stale/partial package installed in site-packages (which made
# generic classes like `BaseTool[T]` look non-generic).
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# keyring is an optional dependency (file-backed credential storage is used
# when it is absent). Importing it must not fail type-checking on machines
# without it installed. `keyring.*` covers submodules such as `keyring.errors`.
module = ["keyring", "keyring.*"]
ignore_missing_imports = true
