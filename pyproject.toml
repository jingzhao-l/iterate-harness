[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iterate-harness"
version = "1.9.2"
description = "iterate-skill powered fork of OpenHarness - dedicated agent harness for the iterate review/fix loop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "jingzhao-l" },
]

# Dependencies pinned after first successful resolve; upstream inherited `>=` ranges.
# channels-only deps (slack-sdk / python-telegram-bot / discord.py / lark-oapi) removed with channels/ trim.
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mcp>=1.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "questionary>=2.0.1",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
ih = "iterate_harness.cli:app"
iterate-harness = "iterate_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/iterate_harness"]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.openharness-venv",
    "/.openharness",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"frontend/terminal/package.json" = "iterate_harness/_frontend/package.json"
"frontend/terminal/tsconfig.json" = "iterate_harness/_frontend/tsconfig.json"
"frontend/terminal/src" = "iterate_harness/_frontend/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly: ruff 0.16 expanded its default rules, which
# would suddenly fail CI on version bumps. This is the set the codebase
# was written and reviewed against.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
